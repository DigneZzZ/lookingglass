# Included inside a server with download_php and the two shared zones defined.
location = /download.php {
    limit_conn download_client 2;
    limit_conn download_global 16;
    limit_conn_status 429;
    error_page 429 = @download_busy;

    include fastcgi_params;
    fastcgi_param SCRIPT_FILENAME /var/www/html/download.php;
    fastcgi_param LG_DOWNLOAD_OFFLOAD 1;
    fastcgi_pass download_php;
    fastcgi_read_timeout 10s;
}

location ~ ^/_speedtest/(100MB|1GB|10GB)\.bin$ {
    internal;
    alias /srv/files/$1.bin;
    limit_conn download_client 2;
    limit_conn download_global 16;
    limit_conn_status 429;
    error_page 429 = @download_busy;
    send_timeout 30s;
    max_ranges 0;
    gzip off;
    add_header X-Download-Remaining $upstream_http_x_download_remaining always;
}

location /_speedtest/ { return 404; }
location /files/ { return 403; }

location @download_busy {
    default_type application/json;
    add_header X-Download-Error 'Too many active downloads; retry after a transfer finishes' always;
    return 429 '{"error":"Too many active downloads","message":"Please retry after an active transfer finishes"}';
}
