user nginx;
worker_processes 1;
error_log /dev/stderr warn;
pid /run/nginx.pid;
events { worker_connections 1024; }
http {
    default_type application/octet-stream;
    access_log /dev/stdout combined;
    sendfile on;

    # This service has no published port. Caddy overwrites this header with
    # the socket peer address; never use this configuration on a public port.
    map $http_x_lg_client $download_client {
        "" $binary_remote_addr;
        default $http_x_lg_client;
    }
    limit_conn_zone $download_client zone=download_client:1m;
    limit_conn_zone $server_name zone=download_global:1m;
    upstream download_php { server lg-php:9000; }

    server {
        listen 80;
        server_name _;
        include /etc/nginx/download-locations.conf;
        location / { return 404; }
    }
}
